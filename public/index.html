<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dhoom Video</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="/logo.svg">

    <script src="/socket.io/socket.io.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            background: #0b0f19;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid #202938;
            background: #101522;
        }


        .logo {
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .logo img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }


        .logo span {
            color: #4f8cff;
        }


        .status {
            color: #22c55e;
            font-size: 14px;
            font-weight: 600;
            padding: 7px 12px;
            border-radius: 20px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.25);
        }


        /* =========================
           ROOM PANEL
        ========================= */

        .room-panel {
            max-width: 850px;
            margin: 30px auto;
            padding: 25px;
            background: linear-gradient(
                145deg,
                #121927,
                #0f1624
            );
            border: 1px solid #263146;
            border-radius: 18px;
            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.35);
        }


        .room-panel h2 {
            margin-top: 0;
        }


        .tagline {
            margin-top: -10px;
            margin-bottom: 18px;
            color: #9ca3af;
            font-size: 14px;
        }


        .room-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }


        input {
            flex: 1;
            min-width: 180px;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #303b4f;
            background: #0b0f19;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.2s ease;
        }


        input::placeholder {
            color: #6b7280;
        }


        input:focus {
            border-color: #4f8cff;
            box-shadow:
                0 0 0 3px
                rgba(79, 140, 255, 0.15);
        }


        /* =========================
           BUTTONS
        ========================= */

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            cursor: pointer;
            color: white;
            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #4f8cff
                );
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s ease;
            box-shadow:
                0 4px 12px
                rgba(37, 99, 235, 0.25);
        }


        button:hover {
            transform: translateY(-2px);
            box-shadow:
                0 6px 18px
                rgba(37, 99, 235, 0.35);
        }


        button:active {
            transform: translateY(0);
        }


        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }


        /* COPY BUTTON */

        #copyBtn {
            background: #059669;
        }


        .copy-btn {
            transition: 0.2s ease;
        }


        .copy-btn:hover {
            background: #10b981;
        }


        /* =========================
           ROOM STATUS
        ========================= */

        #roomStatus {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 10px;
            background:
                rgba(79, 140, 255, 0.08);
            border:
                1px solid
                rgba(79, 140, 255, 0.18);
            color: #b8c7e6;
            font-size: 14px;
            font-weight: 500;
        }


        /* =========================
           VIDEOS
        ========================= */

        .videos {
            max-width: 1100px;
            margin: auto;
            padding: 10px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }


        .video-card {
            position: relative;
            background: #121927;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #263146;
            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.3);
            transition: 0.2s ease;
        }


        .video-card:hover {
            transform: translateY(-3px);
            box-shadow:
                0 14px 35px
                rgba(0, 0, 0, 0.4);
        }


        .video-card video {
            width: 100%;
            height: 360px;
            display: block;
            object-fit: cover;
            background: #05070b;
        }


        /* MIRROR ONLY MY CAMERA */

        #myVideo {
            transform: scaleX(-1);
        }


        .video-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background:
                rgba(8, 12, 22, 0.8);
            backdrop-filter: blur(8px);
            padding: 8px 13px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            border:
                1px solid
                rgba(255, 255, 255, 0.08);
        }


        /* =========================
           CALL CONTROLS
        ========================= */

        .controls {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            padding: 14px;
            background:
                rgba(18, 25, 39, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid #303b50;
            border-radius: 18px;
            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.45);
            z-index: 100;
        }


        .control-btn {
            width: 52px;
            height: 52px;
            padding: 0;
            border-radius: 50%;
            background: #293347;
            font-size: 19px;
            border: 1px solid #3a465c;
            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.25);
            transition: 0.2s ease;
        }


        .control-btn:hover {
            transform: translateY(-3px);
            background: #364258;
            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.35);
        }


        #startBtn {
            background: #2563eb;
        }


        .start-camera-btn {
            width: 80px;
            border-radius: 26px;
            font-size: 15px;
        }


        #endBtn {
            background: #dc2626;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {
                height: 60px;
                padding: 0 15px;
            }


            .logo {
                font-size: 18px;
                gap: 7px;
            }


            .logo img {
                width: 32px;
                height: 32px;
            }


            .status {
                font-size: 12px;
                padding: 6px 9px;
            }


            .room-panel {
                margin: 15px 12px;
                padding: 15px;
            }


            .room-panel h2 {
                font-size: 20px;
            }


            .room-controls {
                flex-direction: column;
            }


            input,
            .room-controls button {
                width: 100%;
            }


            .videos {
                grid-template-columns: 1fr;
                padding: 5px 12px;
                gap: 12px;
            }


            .video-card video {
                height: 250px;
            }


            .controls {
                bottom: 12px;
                gap: 7px;
                padding: 9px;
            }


            .control-btn {
                width: 45px;
                height: 45px;
                font-size: 17px;
            }


            .start-camera-btn {
                width: 72px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="logo">

            <img
                src="/logo.svg"
                alt="Dhoom Video">

            <span>Dhoom Video</span>

        </div>


        <div class="status">
            🔒 Secure
        </div>

    </header>



    <!-- =========================
         ROOM PANEL
    ========================== -->

    <div class="room-panel">

        <h2>
            Connect. Call. Dhoom! 🎥
        </h2>


        <p class="tagline">
            Connect. Call. Dhoom!
        </p>


        <div class="room-controls">


            <button id="createBtn">

                ➕ Create Room

            </button>


            <input
                id="roomInput"
                type="text"
                placeholder="Enter Room ID">


            <button id="joinBtn">

                Join Room

            </button>


            <button
                id="copyBtn"
                class="copy-btn"
                disabled
                title="Copy invitation link">

                🔗 Copy Link

            </button>


        </div>


        <div id="roomStatus">

            Create a room or enter a Room ID to join.

        </div>

    </div>



    <!-- =========================
         VIDEO AREA
    ========================== -->

    <div class="videos">


        <div class="video-card">

            <video
                id="myVideo"
                autoplay
                muted
                playsinline>
            </video>


            <div class="video-label">

                👤 You

            </div>

        </div>



        <div class="video-card">

            <video
                id="remoteVideo"
                autoplay
                playsinline>
            </video>


            <div class="video-label">

                👤 Other Person

            </div>

        </div>

    </div>



    <!-- =========================
         CONTROLS
    ========================== -->

    <div class="controls">


        <button
            id="startBtn"
            class="control-btn start-camera-btn"
            title="Start Camera">

            🎥
            <span>Start</span>

        </button>


        <button
            id="muteBtn"
            class="control-btn"
            disabled
            title="Mute">

            🎤

        </button>


        <button
            id="cameraBtn"
            class="control-btn"
            disabled
            title="Camera">

            📹

        </button>


        <button
            id="endBtn"
            class="control-btn"
            disabled
            title="End Call">

            📞

        </button>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>


        const socket = io();


        const myVideo =
            document.getElementById("myVideo");


        const remoteVideo =
            document.getElementById("remoteVideo");


        const startBtn =
            document.getElementById("startBtn");


        const muteBtn =
            document.getElementById("muteBtn");


        const cameraBtn =
            document.getElementById("cameraBtn");


        const endBtn =
            document.getElementById("endBtn");


        const createBtn =
            document.getElementById("createBtn");


        const joinBtn =
            document.getElementById("joinBtn");


        const copyBtn =
            document.getElementById("copyBtn");


        const roomInput =
            document.getElementById("roomInput");


        const roomStatus =
            document.getElementById("roomStatus");



        let localStream = null;

        let peerConnection = null;

        let roomId = null;

        let microphoneOn = true;

        let cameraOn = true;



        /* =========================
           WEBRTC CONFIGURATION
        ========================== */

        const configuration = {

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }

            ]

        };



        /* =========================
           CREATE ROOM
        ========================== */

        createBtn.addEventListener(
            "click",
            () => {

                roomId =
                    Math.random()
                    .toString(36)
                    .substring(2, 8)
                    .toUpperCase();


                roomInput.value =
                    roomId;


                /*
                 * Automatically join room
                 */

                socket.emit(
                    "join-room",
                    roomId
                );


                roomStatus.innerText =
                    "Room created & joined: "
                    + roomId;


                copyBtn.disabled =
                    false;

            }
        );



        /* =========================
           JOIN ROOM
        ========================== */

        joinBtn.addEventListener(
            "click",
            () => {

                const id =
                    roomInput.value.trim();


                if (!id) {

                    alert(
                        "Room ID enter karo."
                    );

                    return;

                }


                roomId =
                    id.toUpperCase();


                roomInput.value =
                    roomId;


                socket.emit(
                    "join-room",
                    roomId
                );


                roomStatus.innerText =
                    "Joined Room: "
                    + roomId;


                copyBtn.disabled =
                    false;

            }
        );



        /* =========================
           COPY LINK
        ========================== */

        copyBtn.addEventListener(
            "click",
            async () => {

                if (!roomId)
                    return;


                const inviteLink =
                    window.location.origin
                    + "?room="
                    + roomId;


                try {

                    await navigator.clipboard
                        .writeText(inviteLink);


                    copyBtn.innerText =
                        "✅ Copied";


                    setTimeout(
                        () => {

                            copyBtn.innerText =
                                "🔗 Copy Link";

                        },
                        2000
                    );

                }


                catch (error) {

                    alert(
                        "Link copy nahi ho saka."
                    );

                }

            }
        );



        /* =========================
           ROOM FROM URL
        ========================== */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const roomFromLink =
            urlParams.get("room");


        if (roomFromLink) {

            roomId =
                roomFromLink.toUpperCase();


            roomInput.value =
                roomId;


            roomStatus.innerText =
                "Room link detected. Click Join Room.";


            copyBtn.disabled =
                false;

        }



        /* =========================
           START CAMERA
        ========================== */

        startBtn.addEventListener(
            "click",
            async () => {

                try {

                    localStream =
                        await navigator
                        .mediaDevices
                        .getUserMedia({

                            video: true,

                            audio: true

                        });


                    myVideo.srcObject =
                        localStream;


                    startBtn.disabled =
                        true;


                    muteBtn.disabled =
                        false;


                    cameraBtn.disabled =
                        false;


                    endBtn.disabled =
                        false;

                }


                catch (error) {

                    console.error(error);


                    alert(
                        "Camera aur microphone permission allow karo."
                    );

                }

            }
        );



        /* =========================
           USER JOINED
        ========================== */

        socket.on(
            "user-joined",
            async () => {

                if (!localStream) {

                    alert(
                        "Pehle camera start karo."
                    );

                    return;

                }


                createPeerConnection();


                const offer =
                    await peerConnection
                    .createOffer();


                await peerConnection
                    .setLocalDescription(
                        offer
                    );


                socket.emit(
                    "offer",
                    {

                        roomId: roomId,

                        offer: offer

                    }
                );

            }
        );



        /* =========================
           RECEIVE OFFER
        ========================== */

        socket.on(
            "offer",
            async (offer) => {

                if (!localStream)
                    return;


                createPeerConnection();


                await peerConnection
                    .setRemoteDescription(
                        new RTCSessionDescription(
                            offer
                        )
                    );


                const answer =
                    await peerConnection
                    .createAnswer();


                await peerConnection
                    .setLocalDescription(
                        answer
                    );


                socket.emit(
                    "answer",
                    {

                        roomId: roomId,

                        answer: answer

                    }
                );

            }
        );



        /* =========================
           RECEIVE ANSWER
        ========================== */

        socket.on(
            "answer",
            async (answer) => {

                if (!peerConnection)
                    return;


                await peerConnection
                    .setRemoteDescription(
                        new RTCSessionDescription(
                            answer
                        )
                    );

            }
        );



        /* =========================
           ICE CANDIDATE
        ========================== */

        socket.on(
            "ice-candidate",
            async (candidate) => {

                if (!peerConnection)
                    return;


                try {

                    await peerConnection
                        .addIceCandidate(
                            new RTCIceCandidate(
                                candidate
                            )
                        );

                }


                catch (error) {

                    console.error(error);

                }

            }
        );



        /* =========================
           CREATE PEER CONNECTION
        ========================== */

        function createPeerConnection() {

            peerConnection =
                new RTCPeerConnection(
                    configuration
                );


            localStream
                .getTracks()
                .forEach(
                    track => {

                        peerConnection.addTrack(
                            track,
                            localStream
                        );

                    }
                );


            peerConnection.ontrack =
                event => {

                    remoteVideo.srcObject =
                        event.streams[0];

                };


            peerConnection.onicecandidate =
                event => {

                    if (event.candidate) {

                        socket.emit(
                            "ice-candidate",
                            {

                                roomId:
                                    roomId,

                                candidate:
                                    event.candidate

                            }
                        );

                    }

                };

        }



        /* =========================
           MUTE
        ========================== */

        muteBtn.addEventListener(
            "click",
            () => {

                if (!localStream)
                    return;


                const audioTrack =
                    localStream
                    .getAudioTracks()[0];


                if (!audioTrack)
                    return;


                microphoneOn =
                    !microphoneOn;


                audioTrack.enabled =
                    microphoneOn;


                muteBtn.innerText =
                    microphoneOn
                    ? "🎤"
                    : "🔇";


                muteBtn.title =
                    microphoneOn
                    ? "Mute"
                    : "Unmute";

            }
        );



        /* =========================
           CAMERA
        ========================== */

        cameraBtn.addEventListener(
            "click",
            () => {

                if (!localStream)
                    return;


                const videoTrack =
                    localStream
                    .getVideoTracks()[0];


                if (!videoTrack)
                    return;


                cameraOn =
                    !cameraOn;


                videoTrack.enabled =
                    cameraOn;


                cameraBtn.innerText =
                    cameraOn
                    ? "📹"
                    : "🚫";


                cameraBtn.title =
                    cameraOn
                    ? "Camera Off"
                    : "Camera On";

            }
        );



        /* =========================
           END CALL
        ========================== */

        endBtn.addEventListener(
            "click",
            () => {

                endCall();


                if (roomId) {

                    socket.emit(
                        "end-call",
                        roomId
                    );

                }

            }
        );



        /* =========================
           OTHER USER ENDED CALL
        ========================== */

        socket.on(
            "end-call",
            () => {

                endCall();

            }
        );



        /* =========================
           END CALL FUNCTION
        ========================== */

        function endCall() {

            if (localStream) {

                localStream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

            }


            if (peerConnection) {

                peerConnection.close();

                peerConnection =
                    null;

            }


            myVideo.srcObject =
                null;


            remoteVideo.srcObject =
                null;


            startBtn.disabled =
                false;


            muteBtn.disabled =
                true;


            cameraBtn.disabled =
                true;


            endBtn.disabled =
                true;


            microphoneOn =
                true;


            cameraOn =
                true;


            muteBtn.innerText =
                "🎤";


            cameraBtn.innerText =
                "📹";


            muteBtn.title =
                "Mute";


            cameraBtn.title =
                "Camera";

        }

    </script>


</body>

</html>
