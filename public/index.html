<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dhoom Video - Connect. Call. Dhoom!</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="/logo.svg"
    >

    <script src="/socket.io/socket.io.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #07111f,
                    #101b35
                );

            color: white;
            min-height: 100vh;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.1);

            background:
                rgba(5, 12, 25, 0.8);

            backdrop-filter: blur(10px);
        }


        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 22px;
            font-weight: bold;
        }


        .logo img {
            width: 42px;
            height: 42px;
        }


        .secure {
            padding: 8px 14px;

            border-radius: 20px;

            background:
                rgba(0, 200, 120, 0.15);

            color: #57e6a0;

            font-size: 13px;
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            max-width: 1250px;

            margin: auto;

            padding: 30px 20px;
        }


        /* =========================
           ROOM PANEL
        ========================= */

        .room-panel {
            background:
                rgba(255, 255, 255, 0.06);

            border:
                1px solid
                rgba(255, 255, 255, 0.1);

            border-radius: 18px;

            padding: 20px;

            margin-bottom: 25px;
        }


        .room-panel h2 {
            margin-bottom: 15px;
        }


        .room-controls {
            display: flex;

            flex-wrap: wrap;

            align-items: center;

            gap: 10px;
        }


        /* =========================
           INPUT
        ========================= */

        input {
            padding: 11px 14px;

            border: none;

            border-radius: 10px;

            outline: none;

            background:
                rgba(255, 255, 255, 0.1);

            color: white;

            font-size: 14px;
        }


        input::placeholder {
            color: #aab4c8;
        }


        #roomInput {
            width: 220px;
        }


        /* =========================
           GLOW BUTTONS
        ========================= */

        button {
            border: none;

            padding: 11px 17px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 600;

            font-size: 14px;

            color: white;

            position: relative;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;

            box-shadow:
                0 0 8px
                rgba(0, 198, 255, 0.25);
        }


        button:hover {
            transform:
                translateY(-2px);

            box-shadow:
                0 0 10px
                rgba(0, 198, 255, 0.55),

                0 0 25px
                rgba(36, 87, 255, 0.35);
        }


        button:active {
            transform:
                translateY(0);

            box-shadow:
                0 0 8px
                rgba(0, 198, 255, 0.35);
        }


        button:disabled {
            opacity: 0.5;

            cursor: not-allowed;

            box-shadow: none;

            transform: none;
        }


        /* BLUE BUTTON */

        .primary {
            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #2457ff
                );

            box-shadow:
                0 0 10px
                rgba(0, 198, 255, 0.45),

                0 0 25px
                rgba(36, 87, 255, 0.25);
        }


        .primary:hover {
            box-shadow:
                0 0 15px
                rgba(0, 198, 255, 0.8),

                0 0 35px
                rgba(36, 87, 255, 0.55);
        }


        /* SECONDARY */

        .secondary {
            background:
                rgba(255, 255, 255, 0.08);

            border:
                1px solid
                rgba(0, 198, 255, 0.35);

            box-shadow:
                0 0 8px
                rgba(0, 198, 255, 0.20);
        }


        .secondary:hover {
            background:
                rgba(0, 198, 255, 0.12);

            border-color:
                rgba(0, 198, 255, 0.75);

            box-shadow:
                0 0 12px
                rgba(0, 198, 255, 0.65),

                0 0 25px
                rgba(36, 87, 255, 0.35);
        }


        /* RED END CALL */

        .danger {
            background:
                linear-gradient(
                    135deg,
                    #ff4b4b,
                    #e11d48
                );

            box-shadow:
                0 0 10px
                rgba(239, 68, 68, 0.45);
        }


        .danger:hover {
            box-shadow:
                0 0 15px
                rgba(239, 68, 68, 0.8),

                0 0 30px
                rgba(239, 68, 68, 0.45);
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            margin-top: 15px;

            color: #9eabc1;

            font-size: 14px;
        }


        /* =========================
           VIDEO + CHAT
        ========================= */

        .call-layout {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                330px;

            gap: 20px;

            align-items: start;
        }


        /* =========================
           VIDEO
        ========================= */

        .video-section {
            min-width: 0;
        }


        .videos {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 15px;
        }


        .video-card {
            position: relative;

            background: #050a14;

            border-radius: 18px;

            overflow: hidden;

            min-height: 300px;

            border:
                1px solid
                rgba(255, 255, 255, 0.1);
        }


        video {
            width: 100%;

            height: 100%;

            min-height: 300px;

            object-fit: cover;

            display: block;
        }


        #localVideo {
            transform:
                scaleX(-1);
        }


        .video-label {
            position: absolute;

            left: 12px;
            bottom: 12px;

            padding: 7px 10px;

            border-radius: 8px;

            background:
                rgba(0, 0, 0, 0.55);

            font-size: 13px;
        }


        /* =========================
           CALL CONTROLS
        ========================= */

        .controls {
            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 20px;
        }


        /* =========================
           CHAT
        ========================= */

        .chat {
            height: 620px;

            background:
                rgba(255, 255, 255, 0.06);

            border:
                1px solid
                rgba(255, 255, 255, 0.1);

            border-radius: 18px;

            display: flex;

            flex-direction: column;

            overflow: hidden;
        }


        .chat-header {
            padding: 17px;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.1);

            display: flex;

            justify-content:
                space-between;

            align-items: center;
        }


        .chat-title {
            font-size: 18px;

            font-weight: bold;
        }


        .online {
            font-size: 12px;

            color: #57e6a0;
        }


        /* =========================
           MESSAGES
        ========================= */

        .messages {
            flex: 1;

            overflow-y: auto;

            padding: 15px;

            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        .message {
            max-width: 80%;

            padding: 10px 12px;

            border-radius: 12px;

            word-wrap: break-word;

            font-size: 14px;

            line-height: 1.4;
        }


        .message.me {
            align-self: flex-end;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #2457ff
                );

            border-bottom-right-radius: 3px;

            box-shadow:
                0 0 10px
                rgba(0, 198, 255, 0.25);
        }


        .message.other {
            align-self: flex-start;

            background:
                rgba(255, 255, 255, 0.10);

            border-bottom-left-radius: 3px;
        }


        .message-time {
            display: block;

            margin-top: 4px;

            font-size: 10px;

            opacity: 0.65;
        }


        .empty-chat {
            margin: auto;

            text-align: center;

            color: #8995aa;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =========================
           CHAT INPUT
        ========================= */

        .chat-input-area {
            display: flex;

            align-items: center;

            gap: 8px;

            padding: 12px;

            border-top:
                1px solid
                rgba(255, 255, 255, 0.1);
        }


        .chat-input-area input {
            flex: 1;

            min-width: 0;
        }


        .send-button {
            padding: 11px 17px;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #2457ff
                );

            color: white;

            white-space: nowrap;

            box-shadow:
                0 0 10px
                rgba(0, 198, 255, 0.45);
        }


        .send-button:hover {
            box-shadow:
                0 0 15px
                rgba(0, 198, 255, 0.8),

                0 0 30px
                rgba(36, 87, 255, 0.5);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .call-layout {
                grid-template-columns: 1fr;
            }


            .chat {
                height: 450px;
            }
        }


        @media (max-width: 650px) {

            header {
                padding: 0 15px;
            }


            .container {
                padding: 20px 12px;
            }


            .videos {
                grid-template-columns: 1fr;
            }


            .video-card {
                min-height: 230px;
            }


            video {
                min-height: 230px;
            }


            .room-controls {
                flex-direction: row;
            }


            #roomInput {
                width: 100%;

                flex-basis: 100%;
            }


            .room-controls button {
                width: auto;
            }


            .chat-input-area input {
                width: auto;
            }


            .chat-input-area button {
                width: auto;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="logo">

            <img
                src="/logo.svg"
                alt="Dhoom Video"
            >

            <span>
                Dhoom Video
            </span>

        </div>


        <div class="secure">
            🔒 Secure
        </div>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">


        <!-- ROOM -->

        <section class="room-panel">

            <h2>
                📹 Video Call
            </h2>


            <div class="room-controls">

                <button
                    id="createRoomBtn"
                    class="primary"
                >
                    Create Room
                </button>


                <input
                    id="roomInput"
                    type="text"
                    placeholder="Enter Room ID"
                >


                <button
                    id="joinRoomBtn"
                    class="secondary"
                >
                    Join Room
                </button>


                <button
                    id="copyLinkBtn"
                    class="secondary"
                >
                    Copy Link
                </button>


                <button
                    id="shareBtn"
                    class="secondary"
                >
                    Share
                </button>

            </div>


            <div
                id="status"
                class="status"
            >
                Create a room or enter a Room ID.
            </div>

        </section>


        <!-- =========================
             CALL AREA
        ========================= -->

        <div class="call-layout">


            <!-- VIDEO -->

            <section class="video-section">

                <div class="videos">


                    <div class="video-card">

                        <video
                            id="localVideo"
                            autoplay
                            muted
                            playsinline
                        ></video>

                        <div class="video-label">
                            You
                        </div>

                    </div>


                    <div class="video-card">

                        <video
                            id="remoteVideo"
                            autoplay
                            playsinline
                        ></video>

                        <div class="video-label">
                            Other person
                        </div>

                    </div>

                </div>


                <!-- CONTROLS -->

                <div class="controls">

                    <button
                        id="startCameraBtn"
                        class="primary"
                    >
                        🎥 Start Camera
                    </button>


                    <button
                        id="muteBtn"
                        class="secondary"
                    >
                        🎤 Mute
                    </button>


                    <button
                        id="cameraBtn"
                        class="secondary"
                    >
                        📷 Camera Off
                    </button>


                    <button
                        id="endCallBtn"
                        class="danger"
                    >
                        📞 End Call
                    </button>

                </div>

            </section>


            <!-- =========================
                 CHAT
            ========================= -->

            <section class="chat">


                <div class="chat-header">

                    <div class="chat-title">
                        💬 Dhoom Chat
                    </div>


                    <div
                        id="onlineStatus"
                        class="online"
                    >
                        ● Ready
                    </div>

                </div>


                <div
                    id="messages"
                    class="messages"
                >

                    <div
                        id="emptyChat"
                        class="empty-chat"
                    >

                        💬
                        <br>

                        Your messages will appear here.

                        <br><br>

                        Join a room to start chatting.

                    </div>

                </div>


                <div class="chat-input-area">

                    <input
                        id="chatInput"
                        type="text"
                        placeholder="Type a message..."
                        maxlength="500"
                    >


                    <button
                        id="sendBtn"
                        class="send-button"
                    >
                        Send
                    </button>

                </div>


            </section>


        </div>

    </main>


    <script>


        // =========================
        // SOCKET.IO
        // =========================

        const socket = io();


        // =========================
        // ELEMENTS
        // =========================

        const createRoomBtn =
            document.getElementById(
                "createRoomBtn"
            );

        const joinRoomBtn =
            document.getElementById(
                "joinRoomBtn"
            );

        const roomInput =
            document.getElementById(
                "roomInput"
            );

        const copyLinkBtn =
            document.getElementById(
                "copyLinkBtn"
            );

        const shareBtn =
            document.getElementById(
                "shareBtn"
            );

        const status =
            document.getElementById(
                "status"
            );

        const startCameraBtn =
            document.getElementById(
                "startCameraBtn"
            );

        const muteBtn =
            document.getElementById(
                "muteBtn"
            );

        const cameraBtn =
            document.getElementById(
                "cameraBtn"
            );

        const endCallBtn =
            document.getElementById(
                "endCallBtn"
            );

        const localVideo =
            document.getElementById(
                "localVideo"
            );

        const remoteVideo =
            document.getElementById(
                "remoteVideo"
            );

        const chatInput =
            document.getElementById(
                "chatInput"
            );

        const sendBtn =
            document.getElementById(
                "sendBtn"
            );

        const messages =
            document.getElementById(
                "messages"
            );

        const emptyChat =
            document.getElementById(
                "emptyChat"
            );

        const onlineStatus =
            document.getElementById(
                "onlineStatus"
            );


        // =========================
        // VARIABLES
        // =========================

        let roomId = null;

        let localStream = null;

        let peerConnection = null;

        let isMuted = false;

        let isCameraOff = false;


        // =========================
        // WEBRTC
        // =========================

        const configuration = {

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }

            ]

        };


        // =========================
        // STATUS
        // =========================

        function setStatus(text) {

            status.textContent = text;

        }


        // =========================
        // CREATE ROOM
        // =========================

        createRoomBtn.addEventListener(
            "click",
            () => {

                const newRoomId =
                    Math.random()
                        .toString(36)
                        .substring(2, 9);

                roomInput.value =
                    newRoomId;

                joinRoom(newRoomId);

            }
        );


        // =========================
        // JOIN ROOM
        // =========================

        joinRoomBtn.addEventListener(
            "click",
            () => {

                const id =
                    roomInput.value.trim();

                if (!id) {

                    alert(
                        "Please enter Room ID."
                    );

                    return;
                }

                joinRoom(id);

            }
        );


        function joinRoom(id) {

            roomId = id;

            roomInput.value =
                roomId;

            const newUrl =
                `${window.location.origin}/?room=${encodeURIComponent(roomId)}`;

            window.history.replaceState(
                {},
                "",
                newUrl
            );

            socket.emit(
                "join-room",
                roomId
            );

            setStatus(
                `Joined room: ${roomId}`
            );

            onlineStatus.textContent =
                "● In room";
        }


        // =========================
        // URL ROOM
        // =========================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const urlRoom =
            urlParams.get("room");


        if (urlRoom) {

            roomInput.value =
                urlRoom;

            joinRoom(urlRoom);

        }


        // =========================
        // START CAMERA
        // =========================

        startCameraBtn.addEventListener(
            "click",
            async () => {

                try {

                    localStream =
                        await navigator.mediaDevices
                            .getUserMedia({
                                video: true,
                                audio: true
                            });

                    localVideo.srcObject =
                        localStream;

                    startCameraBtn.disabled =
                        true;

                    setStatus(
                        "Camera and microphone started."
                    );


                    if (peerConnection) {

                        localStream
                            .getTracks()
                            .forEach(
                                track => {

                                    const sender =
                                        peerConnection
                                            .getSenders()
                                            .find(
                                                s =>
                                                    s.track &&
                                                    s.track.kind ===
                                                    track.kind
                                            );

                                    if (sender) {

                                        sender.replaceTrack(
                                            track
                                        );

                                    }

                                }
                            );

                    }

                }
                catch (error) {

                    console.error(error);

                    alert(
                        "Camera/microphone permission required."
                    );

                }

            }
        );


        // =========================
        // PEER CONNECTION
        // =========================

        function createPeerConnection() {

            if (peerConnection) {

                return peerConnection;

            }


            peerConnection =
                new RTCPeerConnection(
                    configuration
                );


            if (localStream) {

                localStream
                    .getTracks()
                    .forEach(
                        track => {

                            peerConnection.addTrack(
                                track,
                                localStream
                            );

                        }
                    );

            }


            peerConnection.ontrack =
                event => {

                    remoteVideo.srcObject =
                        event.streams[0];

                };


            peerConnection.onicecandidate =
                event => {

                    if (
                        event.candidate &&
                        roomId
                    ) {

                        socket.emit(
                            "ice-candidate",
                            {
                                roomId:
                                    roomId,

                                candidate:
                                    event.candidate
                            }
                        );

                    }

                };


            peerConnection.onconnectionstatechange =
                () => {

                    if (!peerConnection) {
                        return;
                    }

                    const state =
                        peerConnection
                            .connectionState;


                    if (
                        state ===
                        "connected"
                    ) {

                        setStatus(
                            "Connected successfully! 🎉"
                        );

                        onlineStatus.textContent =
                            "● Connected";

                    }


                    if (
                        state ===
                        "disconnected" ||
                        state ===
                        "failed"
                    ) {

                        setStatus(
                            "Connection lost."
                        );

                        onlineStatus.textContent =
                            "● Disconnected";

                    }

                };


            return peerConnection;

        }


        // =========================
        // USER JOINED
        // =========================

        socket.on(
            "user-joined",
            async () => {

                if (!localStream) {

                    setStatus(
                        "Pehle camera start karo."
                    );

                    return;

                }


                const pc =
                    createPeerConnection();


                const offer =
                    await pc.createOffer();


                await pc.setLocalDescription(
                    offer
                );


                socket.emit(
                    "offer",
                    {
                        roomId:
                            roomId,

                        offer:
                            offer
                    }
                );


                setStatus(
                    "Calling other person..."
                );

            }
        );


        // =========================
        // OFFER
        // =========================

        socket.on(
            "offer",
            async offer => {

                const pc =
                    createPeerConnection();


                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        offer
                    )
                );


                const answer =
                    await pc.createAnswer();


                await pc.setLocalDescription(
                    answer
                );


                socket.emit(
                    "answer",
                    {
                        roomId:
                            roomId,

                        answer:
                            answer
                    }
                );


                setStatus(
                    "Connecting call..."
                );

            }
        );


        // =========================
        // ANSWER
        // =========================

        socket.on(
            "answer",
            async answer => {

                if (!peerConnection) {
                    return;
                }


                await peerConnection
                    .setRemoteDescription(
                        new RTCSessionDescription(
                            answer
                        )
                    );

            }
        );


        // =========================
        // ICE
        // =========================

        socket.on(
            "ice-candidate",
            async candidate => {

                try {

                    if (
                        peerConnection &&
                        candidate
                    ) {

                        await peerConnection
                            .addIceCandidate(
                                new RTCIceCandidate(
                                    candidate
                                )
                            );

                    }

                }
                catch (error) {

                    console.error(
                        "ICE error:",
                        error
                    );

                }

            }
        );


        // =========================
        // ROOM FULL
        // =========================

        socket.on(
            "room-full",
            () => {

                setStatus(
                    "Room full! Maximum 2 users allowed."
                );

                alert(
                    "This room is already full."
                );

            }
        );


        // =========================
        // MUTE
        // =========================

        muteBtn.addEventListener(
            "click",
            () => {

                if (!localStream) {

                    alert(
                        "Pehle camera start karo."
                    );

                    return;

                }


                const audioTrack =
                    localStream
                        .getAudioTracks()[0];


                if (!audioTrack) {
                    return;
                }


                audioTrack.enabled =
                    !audioTrack.enabled;


                isMuted =
                    !audioTrack.enabled;


                muteBtn.textContent =
                    isMuted
                        ? "🔇 Unmute"
                        : "🎤 Mute";

            }
        );


        // =========================
        // CAMERA ON / OFF
        // =========================

        cameraBtn.addEventListener(
            "click",
            () => {

                if (!localStream) {

                    alert(
                        "Pehle camera start karo."
                    );

                    return;

                }


                const videoTrack =
                    localStream
                        .getVideoTracks()[0];


                if (!videoTrack) {
                    return;
                }


                videoTrack.enabled =
                    !videoTrack.enabled;


                isCameraOff =
                    !videoTrack.enabled;


                cameraBtn.textContent =
                    isCameraOff
                        ? "📷 Camera On"
                        : "📷 Camera Off";

            }
        );


        // =========================
        // END CALL
        // =========================

        endCallBtn.addEventListener(
            "click",
            endCall
        );


        function endCall() {

            if (roomId) {

                socket.emit(
                    "end-call",
                    roomId
                );

            }


            closeCall();


            setStatus(
                "Call ended."
            );

        }


        function closeCall() {

            if (peerConnection) {

                peerConnection.close();

                peerConnection =
                    null;

            }


            remoteVideo.srcObject =
                null;


            if (localStream) {

                localStream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                localStream =
                    null;

            }


            startCameraBtn.disabled =
                false;


            muteBtn.textContent =
                "🎤 Mute";


            cameraBtn.textContent =
                "📷 Camera Off";


            isMuted = false;

            isCameraOff = false;

        }


        // =========================
        // OTHER USER ENDS CALL
        // =========================

        socket.on(
            "end-call",
            () => {

                closeCall();

                setStatus(
                    "Other person ended the call."
                );

            }
        );


        // =========================
        // USER LEFT
        // =========================

        socket.on(
            "user-left",
            () => {

                remoteVideo.srcObject =
                    null;


                if (peerConnection) {

                    peerConnection.close();

                    peerConnection =
                        null;

                }


                onlineStatus.textContent =
                    "● Other user left";


                setStatus(
                    "Other person left the room."
                );

            }
        );


        // =========================
        // SEND CHAT
        // =========================

        sendBtn.addEventListener(
            "click",
            sendMessage
        );


        chatInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        function sendMessage() {

            const message =
                chatInput.value.trim();


            if (!message) {
                return;
            }


            if (!roomId) {

                alert(
                    "Pehle room join karo."
                );

                return;

            }


            addMessage(
                message,
                "me",
                getCurrentTime()
            );


            socket.emit(
                "chat-message",
                {
                    roomId:
                        roomId,

                    message:
                        message
                }
            );


            chatInput.value =
                "";

            chatInput.focus();

        }


        // =========================
        // RECEIVE CHAT
        // =========================

        socket.on(
            "chat-message",
            data => {

                addMessage(
                    data.message,
                    "other",
                    data.time
                );

            }
        );


        // =========================
        // ADD MESSAGE
        // =========================

        function addMessage(
            message,
            type,
            time
        ) {

            if (emptyChat) {

                emptyChat.remove();

            }


            const messageElement =
                document.createElement(
                    "div"
                );


            messageElement.className =
                `message ${type}`;


            const textElement =
                document.createElement(
                    "div"
                );


            textElement.textContent =
                message;


            const timeElement =
                document.createElement(
                    "span"
                );


            timeElement.className =
                "message-time";


            timeElement.textContent =
                time;


            messageElement.appendChild(
                textElement
            );


            messageElement.appendChild(
                timeElement
            );


            messages.appendChild(
                messageElement
            );


            messages.scrollTop =
                messages.scrollHeight;

        }


        // =========================
        // TIME
        // =========================

        function getCurrentTime() {

            return new Date()
                .toLocaleTimeString(
                    "en-IN",
                    {
                        hour:
                            "2-digit",

                        minute:
                            "2-digit"
                    }
                );

        }


        // =========================
        // COPY LINK
        // =========================

        copyLinkBtn.addEventListener(
            "click",
            async () => {

                if (!roomId) {

                    alert(
                        "Pehle room create/join karo."
                    );

                    return;

                }


                const link =
                    `${window.location.origin}/?room=${encodeURIComponent(roomId)}`;


                try {

                    await navigator
                        .clipboard
                        .writeText(link);


                    copyLinkBtn.textContent =
                        "Copied ✓";


                    setTimeout(
                        () => {

                            copyLinkBtn.textContent =
                                "Copy Link";

                        },
                        2000
                    );

                }
                catch (error) {

                    alert(link);

                }

            }
        );


        // =========================
        // SHARE
        // =========================

        shareBtn.addEventListener(
            "click",
            async () => {

                if (!roomId) {

                    alert(
                        "Pehle room create/join karo."
                    );

                    return;

                }


                const link =
                    `${window.location.origin}/?room=${encodeURIComponent(roomId)}`;


                if (navigator.share) {

                    try {

                        await navigator.share({

                            title:
                                "Dhoom Video",

                            text:
                                "Join my Dhoom Video call!",

                            url:
                                link

                        });

                    }
                    catch (error) {

                        console.log(
                            "Share cancelled"
                        );

                    }

                }
                else {

                    try {

                        await navigator
                            .clipboard
                            .writeText(link);

                        alert(
                            "Room link copied!"
                        );

                    }
                    catch (error) {

                        alert(link);

                    }

                }

            }
        );

    </script>

</body>

</html>
