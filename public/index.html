<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dhoom Video</title>
    <link rel="icon" type="image/png" href="/logo.png">

    <script src="/socket.io/socket.io.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0f19;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        /* HEADER */

        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid #202938;
            background: #101522;
        }

        .logo {
             font-size: 22px;
             font-weight: bold;
             display: flex;
             align-items: center;
             gap: 10px;
}

.logo img {
    width: 38px;
    height: 38px;
    object-fit: contain;
}

        .logo span {
            color: #4f8cff;
        }

        .status {
            color: #22c55e;
            font-size: 14px;
        }

        /* ROOM AREA */

        .room-panel {
            max-width: 850px;
            margin: 25px auto;
            padding: 20px;
            background: #121927;
            border: 1px solid #202938;
            border-radius: 15px;
        }

        .room-panel h2 {
            margin-top: 0;
        }

        .room-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 180px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #303b4f;
            background: #0b0f19;
            color: white;
            font-size: 15px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 17px;
            cursor: pointer;
            color: white;
            background: #2563eb;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.85;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #copyBtn {
            background: #059669;
        }

        /* VIDEOS */

        .videos {
            max-width: 1100px;
            margin: auto;
            padding: 10px 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .video-card {
            position: relative;
            background: #121927;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #202938;
        }

        .video-card video {
            width: 100%;
            height: 360px;
            display: block;
            object-fit: cover;
            background: #05070b;
        }

        .video-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.65);
            padding: 8px 12px;
            border-radius: 7px;
            font-size: 14px;
        }

        /* CONTROLS */

        .controls {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            padding: 12px;
            background: #121927;
            border: 1px solid #263146;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .control-btn {
            width: 50px;
            height: 50px;
            padding: 0;
            border-radius: 50%;
            background: #293347;
            font-size: 19px;
        }

        #startBtn {
            background: #2563eb;
        }

        #endBtn {
            background: #dc2626;
        }

        #roomStatus {
            margin-top: 12px;
            color: #9ca3af;
            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            header {
                padding: 0 15px;
            }

            .videos {
                grid-template-columns: 1fr;
            }

            .video-card video {
                height: 260px;
            }

            .controls {
                bottom: 15px;
            }

            .room-panel {
                margin: 15px;
            }
        }
    </style>
</head>


<body>


<header>

    <div class="logo">
    <img src="/logo.svg" alt="Dhoom Video">
    <span>Dhoom Video</span>
    </div>
</header>


<!-- ROOM PANEL -->

<div class="room-panel">

    <h2>Start a Meeting</h2>

    <div class="room-controls">

        <button id="createBtn">
            ➕ Create Room
        </button>

        <input
            id="roomInput"
            type="text"
            placeholder="Enter Room ID"
        >

        <button id="joinBtn">
            Join Room
        </button>

        <button id="copyBtn" disabled>
            🔗 Copy Link
        </button>

    </div>

    <div id="roomStatus">
        Create a room or enter a Room ID to join.
    </div>

</div>


<!-- VIDEO AREA -->

<div class="videos">


    <div class="video-card">

        <video
            id="myVideo"
            autoplay
            muted
            playsinline>
        </video>

        <div class="video-label">
            👤 You
        </div>

    </div>


    <div class="video-card">

        <video
            id="remoteVideo"
            autoplay
            playsinline>
        </video>

        <div class="video-label">
            👤 Other Person
        </div>

    </div>


</div>


<!-- CONTROLS -->

<div class="controls">

    <button
        id="startBtn"
        class="control-btn"
        title="Start Camera">
        🎥
    </button>

    <button
        id="muteBtn"
        class="control-btn"
        disabled
        title="Mute">
        🎤
    </button>

    <button
        id="cameraBtn"
        class="control-btn"
        disabled
        title="Camera">
        📹
    </button>

    <button
        id="endBtn"
        class="control-btn"
        disabled
        title="End Call">
        📞
    </button>

</div>


<script>

const socket = io();

const myVideo =
    document.getElementById("myVideo");

const remoteVideo =
    document.getElementById("remoteVideo");

const startBtn =
    document.getElementById("startBtn");

const muteBtn =
    document.getElementById("muteBtn");

const cameraBtn =
    document.getElementById("cameraBtn");

const endBtn =
    document.getElementById("endBtn");

const createBtn =
    document.getElementById("createBtn");

const joinBtn =
    document.getElementById("joinBtn");

const copyBtn =
    document.getElementById("copyBtn");

const roomInput =
    document.getElementById("roomInput");

const roomStatus =
    document.getElementById("roomStatus");


let localStream = null;

let peerConnection = null;

let roomId = null;

let microphoneOn = true;

let cameraOn = true;


const configuration = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        }

    ]

};


// CREATE ROOM

createBtn.addEventListener(
    "click",
    () => {

        roomId =
            Math.random()
            .toString(36)
            .substring(2, 8)
            .toUpperCase();

        roomInput.value =
            roomId;

        roomStatus.innerText =
            "Room created: " + roomId;

        copyBtn.disabled =
            false;

    }
);


// JOIN ROOM

joinBtn.addEventListener(
    "click",
    () => {

        const id =
            roomInput.value.trim();

        if (!id) {

            alert(
                "Room ID enter karo."
            );

            return;

        }

        roomId =
            id.toUpperCase();

        roomInput.value =
            roomId;

        socket.emit(
            "join-room",
            roomId
        );

        roomStatus.innerText =
            "Joined Room: " + roomId;

        copyBtn.disabled =
            false;

    }
);


// COPY LINK

copyBtn.addEventListener(
    "click",
    async () => {

        if (!roomId)
            return;

        const inviteLink =
            window.location.origin +
            "?room=" +
            roomId;

        try {

            await navigator.clipboard
                .writeText(inviteLink);

            copyBtn.innerText =
                "✅ Copied";

            setTimeout(
                () => {

                    copyBtn.innerText =
                        "🔗 Copy Link";

                },
                2000
            );

        }

        catch (error) {

            alert(
                "Link copy nahi ho saka."
            );

        }

    }
);


// AUTO ROOM FROM LINK

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const roomFromLink =
    urlParams.get("room");


if (roomFromLink) {

    roomId =
        roomFromLink.toUpperCase();

    roomInput.value =
        roomId;

    roomStatus.innerText =
        "Room link detected. Click Join Room.";

}


// START CAMERA

startBtn.addEventListener(
    "click",
    async () => {

        try {

            localStream =
                await navigator.mediaDevices
                .getUserMedia({

                    video: true,
                    audio: true

                });

            myVideo.srcObject =
                localStream;

            startBtn.disabled =
                true;

            muteBtn.disabled =
                false;

            cameraBtn.disabled =
                false;

            endBtn.disabled =
                false;

        }

        catch (error) {

            console.error(error);

            alert(
                "Camera aur microphone permission allow karo."
            );

        }

    }
);


// USER JOINED

socket.on(
    "user-joined",
    async () => {

        if (!localStream) {

            alert(
                "Pehle camera start karo."
            );

            return;

        }

        createPeerConnection();

        const offer =
            await peerConnection
            .createOffer();

        await peerConnection
            .setLocalDescription(
                offer
            );

        socket.emit(
            "offer",
            {
                roomId: roomId,
                offer: offer
            }
        );

    }
);


// RECEIVE OFFER

socket.on(
    "offer",
    async (offer) => {

        if (!localStream)
            return;

        createPeerConnection();

        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    offer
                )
            );

        const answer =
            await peerConnection
            .createAnswer();

        await peerConnection
            .setLocalDescription(
                answer
            );

        socket.emit(
            "answer",
            {
                roomId: roomId,
                answer: answer
            }
        );

    }
);


// RECEIVE ANSWER

socket.on(
    "answer",
    async (answer) => {

        if (!peerConnection)
            return;

        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    answer
                )
            );

    }
);


// ICE CANDIDATE

socket.on(
    "ice-candidate",
    async (candidate) => {

        if (!peerConnection)
            return;

        try {

            await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

        }

        catch (error) {

            console.error(error);

        }

    }
);


// CREATE PEER CONNECTION

function createPeerConnection() {

    peerConnection =
        new RTCPeerConnection(
            configuration
        );


    localStream
        .getTracks()
        .forEach(
            track => {

                peerConnection.addTrack(
                    track,
                    localStream
                );

            }
        );


    peerConnection.ontrack =
        event => {

            remoteVideo.srcObject =
                event.streams[0];

        };


    peerConnection.onicecandidate =
        event => {

            if (event.candidate) {

                socket.emit(
                    "ice-candidate",
                    {
                        roomId:
                            roomId,

                        candidate:
                            event.candidate
                    }
                );

            }

        };

}


// MUTE

muteBtn.addEventListener(
    "click",
    () => {

        if (!localStream)
            return;

        const audioTrack =
            localStream
            .getAudioTracks()[0];

        if (!audioTrack)
            return;

        microphoneOn =
            !microphoneOn;

        audioTrack.enabled =
            microphoneOn;

        muteBtn.innerText =
            microphoneOn
            ? "🎤"
            : "🔇";

        muteBtn.title =
            microphoneOn
            ? "Mute"
            : "Unmute";

    }
);


// CAMERA

cameraBtn.addEventListener(
    "click",
    () => {

        if (!localStream)
            return;

        const videoTrack =
            localStream
            .getVideoTracks()[0];

        if (!videoTrack)
            return;

        cameraOn =
            !cameraOn;

        videoTrack.enabled =
            cameraOn;

        cameraBtn.innerText =
            cameraOn
            ? "📹"
            : "🚫";

        cameraBtn.title =
            cameraOn
            ? "Camera Off"
            : "Camera On";

    }
);


// END CALL

endBtn.addEventListener(
    "click",
    () => {

        endCall();

        if (roomId) {

            socket.emit(
                "end-call",
                roomId
            );

        }

    }
);


// OTHER USER ENDED CALL

socket.on(
    "end-call",
    () => {

        endCall();

    }
);


// END CALL FUNCTION

function endCall() {

    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    if (peerConnection) {

        peerConnection.close();

        peerConnection =
            null;

    }


    myVideo.srcObject =
        null;

    remoteVideo.srcObject =
        null;


    startBtn.disabled =
        false;

    muteBtn.disabled =
        true;

    cameraBtn.disabled =
        true;

    endBtn.disabled =
        true;


    microphoneOn =
        true;

    cameraOn =
        true;


    muteBtn.innerText =
        "🎤";

    cameraBtn.innerText =
        "📹";

}

</script>

</body>
</html>
